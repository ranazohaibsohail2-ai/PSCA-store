<div id="app"></div>

<script>
// Show any error directly on the page (so it's visible on mobile without devtools).
// This is placed FIRST, before anything else runs, so it catches every possible failure.
window.addEventListener("error", (e) => {
  const el = document.getElementById("app");
  if (el) el.innerHTML = `<div style="padding:20px;font-family:monospace;font-size:13px;color:#C24C3D;white-space:pre-wrap;">SCRIPT ERROR:\n${e.message}\n\nFile: ${e.filename}\nLine: ${e.lineno}</div>`;
});
// Async/await errors (inside init(), event handlers, etc.) don't fire "error" above —
// they show up here instead. Without this listener the page just stays blank white
// with the real problem hidden in the browser console.
window.addEventListener("unhandledrejection", (e) => {
  const el = document.getElementById("app");
  const msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
  const stack = (e.reason && e.reason.stack) ? e.reason.stack : "";
  if (el) el.innerHTML = `<div style="padding:20px;font-family:monospace;font-size:13px;color:#C24C3D;white-space:pre-wrap;">RUNTIME ERROR:\n${msg}\n\n${stack}</div>`;
});

/* =========================================================
   1) PASTE YOUR FIREBASE CONFIG HERE (from Firebase console)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDcm_KU9sPs2eDjqFBBphHTOD6S83-GbTI",
  authDomain: "psca-store.firebaseapp.com",
  projectId: "psca-store",
  storageBucket: "psca-store.firebasestorage.app",
  messagingSenderId: "186719702982",
  appId: "1:186719702982:web:3eb71b087479dd8a58acc7"
};
/* ========================================================= */

let db;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
} catch (e) {
  document.getElementById("app").innerHTML = `<div style="padding:20px;font-family:monospace;font-size:13px;color:#C24C3D;white-space:pre-wrap;">FIREBASE INIT ERROR:\n${e.message}\n\nFirebaseConfig ya Firestore setup check karein.</div>`;
  throw e;
}

// ---------- State ----------
let state = {
  session: JSON.parse(localStorage.getItem("psca_session") || "null"),
  tab: "dashboard",
  storeName: "PSCA Store",
  users: [],
  items: [],
  txns: [],
  auditLog: [],
};

const app = document.getElementById("app");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmt = (d) => new Date(d).toLocaleDateString("en-GB", { day: "2-digit", month: "short" });
const fmtTime = (d) => new Date(d).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const qrUrl = (data) => `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(data)}`;

// ---------- Firestore helpers ----------
async function loadAllData() {
  const [itemsSnap, txnsSnap, usersSnap, auditSnap, settingsSnap] = await Promise.all([
    db.collection("items").orderBy("name").get(),
    db.collection("transactions").orderBy("date", "desc").limit(300).get(),
    db.collection("users").get(),
    db.collection("auditLogs").orderBy("date", "desc").limit(300).get(),
    db.collection("settings").doc("store").get(),
  ]);
  state.items = itemsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  state.txns = txnsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  state.users = usersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  state.auditLog = auditSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  if (settingsSnap.exists) state.storeName = settingsSnap.data().name;

  if (state.users.length === 0) {
    const adminRef = await db.collection("users").add({ name: "Admin", pin: "1234", role: "admin" });
    state.users = [{ id: adminRef.id, name: "Admin", pin: "1234", role: "admin" }];
  }
}

async function logAction(action) {
  const entry = { action, by: state.session?.name || "System", date: new Date().toISOString() };
  await db.collection("auditLogs").add(entry);
  state.auditLog.unshift({ id: uid(), ...entry });
}

// ---------- Render root ----------
function render() {
  if (!state.session) { app.innerHTML = loginView(); bindLogin(); return; }
  app.innerHTML = layoutView();
  bindLayout();
}

// ================= LOGIN =================
function loginView() {
  return `
  <div class="min-h-screen flex items-center justify-center px-5">
    <div class="w-full max-w-sm">
      <div class="text-center mb-6">
        <p class="text-[10px] tracking-[0.2em] text-[#8A93A3] uppercase font-mono">Inventory System</p>
        <h1 class="font-display text-3xl font-bold mt-1">${esc(state.storeName)}</h1>
      </div>
      <form id="loginForm" class="card p-5 space-y-3">
        <div id="loginError" class="hidden text-xs text-[#C24C3D] bg-[#FBEFE9] border border-[#E08A72]/40 rounded-lg px-3 py-2"></div>
        <input name="name" placeholder="Naam" required />
        <input name="pin" type="password" inputmode="numeric" placeholder="PIN" required />
        <button class="w-full py-3 rounded-lg font-display font-semibold btn-primary">Login</button>
      </form>
      <p class="text-[11px] text-[#8A93A3] text-center mt-3">Pehli baar? Naam "Admin", PIN "1234"</p>
    </div>
  </div>`;
}
function bindLogin() {
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const name = f.get("name").trim(), pin = f.get("pin").trim();
    const errEl = document.getElementById("loginError");
    const match = state.users.find(u => u.name.toLowerCase() === name.toLowerCase() && u.pin === pin);
    if (!match) { errEl.textContent = "Naam ya PIN ghalat hai"; errEl.classList.remove("hidden"); return; }
    state.session = match;
    localStorage.setItem("psca_session", JSON.stringify(match));
    render();
  });
}

// ================= LAYOUT =================
const TABS = [
  { id: "dashboard", label: "Dashboard" },
  { id: "inventory", label: "Inventory" },
  { id: "employees", label: "Employees" },
  { id: "ledger", label: "Ledger" },
  { id: "reports", label: "Reports" },
];
function layoutView() {
  const isAdmin = state.session.role === "admin";
  const tabs = isAdmin ? [...TABS, { id: "audit", label: "Audit" }, { id: "users", label: "Users" }] : TABS;
  const lowStock = state.items.filter(i => i.minQty != null && i.qty <= i.minQty);
  const today = new Date().toDateString();
  const todayTxns = state.txns.filter(t => new Date(t.date).toDateString() === today);
  const todayIn = todayTxns.filter(t => ["in","return"].includes(t.type)).reduce((s,t)=>s+t.qty,0);
  const todayOut = todayTxns.filter(t => ["out","issue"].includes(t.type)).reduce((s,t)=>s+t.qty,0);
  const totalValue = state.items.reduce((s,i)=>s+(i.price?i.price*i.qty:0),0);

  return `
  <div class="min-h-screen pb-16">
    <div class="bg-[#1B2A41] text-[#F2F0E9] px-5 md:px-10 pt-6 pb-8 relative overflow-hidden">
      <div class="absolute right-0 top-0 h-full w-1.5 bg-[#E8A33D]"></div>
      <div class="max-w-6xl mx-auto">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-[10px] tracking-[0.2em] text-[#8A93A3] uppercase font-mono">Live Stock Register</p>
            <h1 class="font-display text-2xl md:text-3xl font-bold mt-0.5">${esc(state.storeName)}</h1>
          </div>
          <div class="flex items-center gap-3">
            <div class="text-right">
              <p class="text-sm font-medium">${esc(state.session.name)}</p>
              <p class="text-[10px] text-[#8A93A3] uppercase">${state.session.role}</p>
            </div>
            <button id="logoutBtn" class="text-xs text-[#E8A33D]">Logout</button>
          </div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-5">
          <div class="bg-white/5 rounded-lg px-3 py-2.5 border border-white/10"><p class="text-[10px] text-[#8A93A3] uppercase">Items</p><p class="font-mono text-xl font-semibold">${state.items.length}</p></div>
          <div class="bg-white/5 rounded-lg px-3 py-2.5 border border-white/10"><p class="text-[10px] text-[#8A93A3] uppercase">Value</p><p class="font-mono text-xl font-semibold">${totalValue?totalValue.toLocaleString():"—"}</p></div>
          <div class="bg-white/5 rounded-lg px-3 py-2.5 border border-white/10"><p class="text-[10px] text-[#8A93A3] uppercase">Aaj In</p><p class="font-mono text-xl font-semibold text-[#7FC29B]">+${todayIn}</p></div>
          <div class="bg-white/5 rounded-lg px-3 py-2.5 border border-white/10"><p class="text-[10px] text-[#8A93A3] uppercase">Aaj Out</p><p class="font-mono text-xl font-semibold text-[#E08A72]">-${todayOut}</p></div>
        </div>
      </div>
    </div>
    <div class="max-w-6xl mx-auto">
      <div class="flex px-5 md:px-10 -mt-4 mb-4 gap-2 overflow-x-auto relative z-10">
        ${tabs.map(t => `<button data-tab="${t.id}" class="tabBtn shrink-0 px-4 py-2.5 rounded-lg text-sm font-medium font-display ${state.tab===t.id?"btn-primary":"bg-white text-[#1B2A41]/60 border border-[#1B2A41]/10"}">${t.label}</button>`).join("")}
      </div>
      <div id="tabContent" class="px-5 md:px-10">
        ${lowStock.length>0 ? `<div class="mb-4 bg-[#FBEFE9] border border-[#E08A72]/40 rounded-lg px-3 py-2.5"><p class="text-xs text-[#8A3A2C]"><b>${lowStock.length} item(s)</b> kam stock: ${lowStock.map(i=>esc(i.name)).join(", ")}</p></div>` : ""}
      </div>
    </div>
  </div>
  <div id="modalRoot"></div>`;
}

function bindLayout() {
  document.getElementById("logoutBtn").addEventListener("click", () => {
    state.session = null; localStorage.removeItem("psca_session"); render();
  });
  document.querySelectorAll(".tabBtn").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));
  switchTab(state.tab);
}

async function refreshLayout() { await loadAllData(); const cur = state.tab; app.innerHTML = layoutView(); bindLayout(); state.tab = cur; document.querySelectorAll(".tabBtn").forEach(b=>{ b.className = `tabBtn shrink-0 px-4 py-2.5 rounded-lg text-sm font-medium font-display ${b.dataset.tab===cur?"btn-primary":"bg-white text-[#1B2A41]/60 border border-[#1B2A41]/10"}`; }); renderTabContent(); }

function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll(".tabBtn").forEach(b => { b.className = `tabBtn shrink-0 px-4 py-2.5 rounded-lg text-sm font-medium font-display ${b.dataset.tab===tab?"btn-primary":"bg-white text-[#1B2A41]/60 border border-[#1B2A41]/10"}`; });
  renderTabContent();
}

function renderTabContent() {
  const content = document.getElementById("tabContent");
  const lowStockBanner = content.querySelector(".bg-\\[\\#FBEFE9\\]")?.outerHTML || "";
  let html = lowStockBanner;
  if (state.tab === "dashboard") html += dashboardView();
  if (state.tab === "inventory") html += inventoryView();
  if (state.tab === "employees") html += employeesView();
  if (state.tab === "ledger") html += ledgerView();
  if (state.tab === "reports") html += reportsView();
  if (state.tab === "audit") html += auditView();
  if (state.tab === "users") html += usersView();
  content.innerHTML = html;
  bindTab();

function stockModal(item, dir) {
  if (!item) return;
  const isIn = dir === "in";
  openModal(`
    <p class="font-display font-semibold mb-1">${esc(item.name)}</p>
    <p class="text-xs text-[#8A93A3] mb-3">Mojooda stock: <b class="font-mono">${item.qty} ${esc(item.unit)}</b></p>
    <form id="stockForm" class="space-y-2.5">
      <input name="qty" type="number" step="any" min="0.0001" placeholder="Quantity" required />
      ${isIn
        ? `<select name="type"><option value="in">Stock In</option><option value="return">Return</option></select>`
        : `<select name="type"><option value="out">Stock Out</option><option value="issue">Issue (employee)</option></select>`}
      <input name="note" placeholder="Note (optional)" />
      <div class="flex gap-2 pt-2">
        <button type="button" id="cancelModal" class="flex-1 py-2.5 rounded-lg bg-[#1B2A410D] font-display font-medium">Cancel</button>
        <button class="flex-1 py-2.5 rounded-lg ${isIn ? "btn-green" : "btn-red"} font-display font-medium">Confirm</button>
      </div>
    </form>
  `);
  document.getElementById("cancelModal").addEventListener("click", closeModal);
  document.getElementById("stockForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const qty = parseFloat(f.get("qty"));
    const type = f.get("type");
    const note = f.get("note").trim();
    if (!qty || qty <= 0) return;
    if (!isIn && qty > item.qty) { alert("Stock itna nahi hai."); return; }
    const newQty = isIn ? item.qty + qty : item.qty - qty;
    await db.collection("items").doc(item.id).update({ qty: newQty });
    await db.collection("transactions").add({
      itemId: item.id, itemName: item.name, qty, type, note,
      by: state.session.name, date: new Date().toISOString(),
    });
    await logAction(`${type.toUpperCase()}: ${item.name} (${qty} ${item.unit})`);
    closeModal();
    await refreshLayout();
  });
}

// ================= EVENT BINDING FOR ALL TABS =================
function bindTab() {
  const content = document.getElementById("tabContent");
  if (!content) return;

  // Inventory
  const invSearch = document.getElementById("invSearch");
  if (invSearch) {
    invSearch.addEventListener("input", (e) => {
      state.invSearch = e.target.value;
      renderTabContent();
      const el = document.getElementById("invSearch");
      if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
    });
  }
  const addItemBtn = document.getElementById("addItemBtn");
  if (addItemBtn) addItemBtn.addEventListener("click", () => itemFormModal(null));
  content.querySelectorAll("[data-edit-item]").forEach(b => b.addEventListener("click", () => itemFormModal(state.items.find(i => i.id === b.dataset.editItem))));
  content.querySelectorAll("[data-del-item]").forEach(b => b.addEventListener("click", async () => {
    if (!confirm("Ye item delete karein?")) return;
    const item = state.items.find(i => i.id === b.dataset.delItem);
    await db.collection("items").doc(b.dataset.delItem).delete();
    await logAction(`Item delete: ${item?.name || ""}`);
    await refreshLayout();
  }));
  content.querySelectorAll("[data-stock-in]").forEach(b => b.addEventListener("click", () => stockModal(state.items.find(i => i.id === b.dataset.stockIn), "in")));
  content.querySelectorAll("[data-stock-out]").forEach(b => b.addEventListener("click", () => stockModal(state.items.find(i => i.id === b.dataset.stockOut), "out")));

  // Employees
  const addEmpBtn = document.getElementById("addEmpBtn");
  if (addEmpBtn) addEmpBtn.addEventListener("click", () => empFormModal(null));
  content.querySelectorAll("[data-edit-emp]").forEach(b => b.addEventListener("click", () => empFormModal(state.users.find(u => u.id === b.dataset.editEmp))));
  content.querySelectorAll("[data-del-emp]").forEach(b => b.addEventListener("click", async () => {
    if (!confirm("Ye employee delete karein?")) return;
    const u = state.users.find(x => x.id === b.dataset.delEmp);
    await db.collection("users").doc(b.dataset.delEmp).delete();
    await logAction(`Employee delete: ${u?.name || ""}`);
    await refreshLayout();
  }));

  // Users
  const addUserBtn = document.getElementById("addUserBtn");
  if (addUserBtn) addUserBtn.addEventListener("click", () => userFormModal(null));
  content.querySelectorAll("[data-edit-user]").forEach(b => b.addEventListener("click", () => userFormModal(state.users.find(u => u.id === b.dataset.editUser))));
  content.querySelectorAll("[data-del-user]").forEach(b => b.addEventListener("click", async () => {
    if (b.dataset.delUser === state.session.id) { alert("Apna hi account delete nahi kar sakte."); return; }
    if (!confirm("Ye user delete karein?")) return;
    const u = state.users.find(x => x.id === b.dataset.delUser);
    await db.collection("users").doc(b.dataset.delUser).delete();
    await logAction(`User delete: ${u?.name || ""}`);
    await refreshLayout();
  }));

  // Ledger
  const addTxnBtn = document.getElementById("addTxnBtn");
  if (addTxnBtn) addTxnBtn.addEventListener("click", () => txnFormModal());
  const ledgerFilter = document.getElementById("ledgerFilter");
  if (ledgerFilter) ledgerFilter.addEventListener("change", (e) => { state.ledgerFilter = e.target.value; renderTabContent(); });

  // Reports
  const exportInventoryBtn = document.getElementById("exportInventoryBtn");
  if (exportInventoryBtn) exportInventoryBtn.addEventListener("click", exportInventory);
  const exportLedgerBtn = document.getElementById("exportLedgerBtn");
  if (exportLedgerBtn) exportLedgerBtn.addEventListener("click", exportLedger);
}

// ================= APP INIT =================
(async function init() {
  try {
    await loadAllData();
  } catch (e) {
    app.innerHTML = `<div style="padding:20px;font-family:monospace;font-size:13px;color:#C24C3D;white-space:pre-wrap;">DATA LOAD ERROR:\n${e.message}\n\nFirestore rules ya internet connection check karein.</div>`;
    return;
  }
  try {
    render();
  } catch (e) {
    app.innerHTML = `<div style="padding:20px;font-family:monospace;font-size:13px;color:#C24C3D;white-space:pre-wrap;">RENDER ERROR:\n${e.message}\n\n${e.stack || ""}</div>`;
  }
})();
</script>
</body>
</html>
